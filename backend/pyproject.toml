[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "blastshield-backend"
version = "0.4.0"
description = "Pre-execution safety analysis for destructive PostgreSQL actions"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic-settings>=2.7,<3",
    "psycopg[binary]>=3.2,<4",
    "sqlalchemy>=2.0,<3",
    "sqlglot>=25,<30",
    "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
test = [
    "httpx>=0.28,<1",
    "pytest>=8.3,<9",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
    "integration: requires the BlastShield PostgreSQL fixture",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
