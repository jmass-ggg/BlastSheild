[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "blastshield-mcp-server"
version = "0.4.0"
description = "MCP bridge for the BlastShield HTTP safety gateway"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28,<1",
    "mcp>=1,<2",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9"]

[project.scripts]
blastshield-mcp = "blastshield_mcp.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["blastshield_mcp*"]
